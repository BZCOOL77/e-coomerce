<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier mes informations | Shopy-Cloths</title>
    <script src="../js/url.js"></script>
    <link rel="stylesheet" href="../css/modifier_info.css">
     <link rel="stylesheet" href="../css/client.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  
</head>
<body>
    <div id="overlay"></div>
    <div id="loader"><div class="spinner"></div></div>

    <header>
        <h1>shopy-cloths</h1>
        <h2>modifiez vos informations personnelles</h2>
        
    </header>

    <main class="page-wrap">
        <a class="back-link" href="client.html"><i class="fa-solid fa-arrow-left"></i> Retour à l'accueil</a>

        <section class="form-card">
            <h2>Modifier mes informations</h2>
            <p class="subtext">Mettez à jour votre nom, votre postnom et votre adresse email.</p>

            <form id="modifierForm">
                <div class="form-grid">
                    <div class="field">
                        <label for="nom">Nom</label>
                        <input id="nom" name="nom" type="text" placeholder="Entrez votre nom" required>
                    </div>

                    <div class="field">
                        <label for="prenom">Prenom</label>
                        <input id="prenom" name="prenom" type="text" placeholder="Entrez votre prenom" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="Entrez votre email" required>
                    </div>
                </div>

                <div id="message" class="message" aria-live="polite"></div>

                <div class="actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        const overlay = document.getElementById('overlay');
        const loader = document.getElementById('loader');
        const form = document.getElementById('modifierForm');
        const message = document.getElementById('message');
        const token = localStorage.getItem('token');

        function showMessage(text, type = 'success') {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        function setLoading(isLoading) {
            if (overlay) overlay.style.display = isLoading ? 'block' : 'none';
            if (loader) loader.style.display = isLoading ? 'block' : 'none';
        }

        document.getElementById('cancelBtn').addEventListener('click', () => {
            window.location.href = 'client.html';
        });

        if (!token) {
            alert('Vous devez être connecté pour modifier vos informations.');
            window.location.href = 'connexion.html';
        }
        //ON CHARGE LES INFORMATIONS DE L'UTILISATEUR POUR LES AFFICHER DANS LE FORMULAIRE
        async function chargerProfil() {
            setLoading(true);
            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Impossible de charger votre profil.');
                }

                const user = await response.json();
                document.getElementById('nom').value = user.nom || '';
                document.getElementById('prenom').value = user.prenom || '';
                document.getElementById('email').value = user.email || '';
            } catch (error) {
                showMessage(error.message || 'Erreur lors du chargement du profil.', 'error');
            } finally {
                setLoading(false);
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            setLoading(true);

            const payload = {
                nom: document.getElementById('nom').value.trim(),
                prenom: document.getElementById('prenom').value.trim(),
                email: document.getElementById('email').value.trim()
            };

            //ON ENVOIE LA REQUETE PUT POUR METTRE A JOUR LES INFORMATIONS DE L'UTILISATEUR
            try {
                let response = await fetch(`${CONFIG.API_BASE_URL}/api/auth/me`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) {
                    const text = await response.text().catch(() => '');
                    throw new Error(text || 'La mise à jour a échoué.');
                }

                showMessage('Vos informations ont été mises à jour avec succès. Retour automatique...', 'success');

                setTimeout(() => {
                    window.location.href = 'client.html';
                }, 1400);
            } catch (error) {
                showMessage(error.message || 'Une erreur inattendue est survenue.', 'error');
            } finally {
                setLoading(false);
            }
        });

        chargerProfil();
    </script>
</body>
</html>
