<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer mon mot de passe | Shopy-Cloths</title>
    <link rel="stylesheet" href="../css/client.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        :root {
            --card: rgba(255, 255, 255, 0.95);
            --shadow-card: 0 18px 45px rgba(19, 34, 56, 0.16);
        }

        body {
            padding-bottom: 3rem;
        }

        .page-wrap {
            width: min(900px, calc(100% - 2rem));
            margin: 1.5rem auto 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #132238;
            font-weight: 700;
            text-decoration: none;
            margin: 0 0 1rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .form-card {
            background: var(--card);
            border: 1px solid rgba(19, 34, 56, 0.08);
            box-shadow: var(--shadow-card);
            border-radius: 26px;
            padding: 1.5rem;
            backdrop-filter: blur(8px);
        }

        .form-card h2 {
            margin: 0;
            font-size: clamp(1.6rem, 3vw, 2.1rem);
            color: #132238;
        }

        .subtext {
            margin: 0.55rem 0 1.4rem;
            color: #6a7280;
            font-size: 0.97rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .field label {
            font-size: 0.95rem;
            color: #132238;
            font-weight: 700;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            width: 100%;
            padding: 0.95rem 3rem 0.95rem 1rem;
            border-radius: 14px;
            border: 1px solid rgba(19, 34, 56, 0.16);
            background: #fbfaf8;
            font-size: 0.98rem;
            color: #17202b;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 0.8rem;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #132238;
            cursor: pointer;
            font-size: 1rem;
        }

        .field input {
            width: 100%;
            padding: 0.95rem 1rem;
            border-radius: 14px;
            border: 1px solid rgba(19, 34, 56, 0.16);
            background: #fbfaf8;
            font-size: 0.98rem;
            color: #17202b;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field input:focus {
            border-color: rgba(233, 169, 74, 0.9);
            box-shadow: 0 0 0 4px rgba(233, 169, 74, 0.18);
        }

        .message {
            min-height: 1.4rem;
            margin-top: 1rem;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .message.success {
            color: var(--success);
        }

        .message.error {
            color: var(--danger);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1.2rem;
        }

        .btn-primary,
        .btn-secondary {
            border: none;
            border-radius: 999px;
            padding: 0.9rem 1.25rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, filter 0.18s ease;
        }

        .btn-primary:hover,
        .btn-secondary:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .btn-primary {
            background: linear-gradient(135deg, #e9a94a, #c8851f);
            color: #fff;
            box-shadow: 0 12px 24px rgba(233, 169, 74, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #132238, #20385d);
            color: #fff;
            box-shadow: 0 12px 24px rgba(19, 34, 56, 0.2);
        }

        @media (max-width: 680px) {
            .form-card {
                padding: 1rem;
            }

            .actions {
                justify-content: stretch;
            }

            .actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="overlay"></div>
    <div id="loader"><div class="spinner"></div></div>

    <header>
        <h1>shopy-cloths</h1>
        <h2>changez votre mot de passe en toute sécurité</h2>
    </header>

    <main class="page-wrap">
        <a class="back-link" href="client.html"><i class="fa-solid fa-arrow-left"></i> Retour à l'accueil</a>

        <section class="form-card">
            <h2>Changer mon mot de passe</h2>
            <p class="subtext">Saisissez votre ancien mot de passe et votre nouveau mot de passe.</p>

            <form id="passwordForm">
                <div class="field">
                    <label for="oldPassword">Ancien mot de passe</label>
                    <div class="password-wrap">
                        <input id="oldPassword" name="oldPassword" type="password" placeholder="Entrez votre ancien mot de passe" required>
                        <button type="button" class="password-toggle" data-target="oldPassword" aria-label="Afficher ou masquer le mot de passe">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="newPassword">Nouveau mot de passe</label>
                    <div class="password-wrap">
                        <input id="newPassword" name="newPassword" type="password" placeholder="Entrez votre nouveau mot de passe" required>
                        <button type="button" class="password-toggle" data-target="newPassword" aria-label="Afficher ou masquer le mot de passe">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirmation du nouveau mot de passe</label>
                    <div class="password-wrap">
                        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirmez votre nouveau mot de passe" required>
                        <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Afficher ou masquer le mot de passe">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="message" class="message" aria-live="polite"></div>

                <div class="actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </form>
        </section>
    </main>

    <script>
        const overlay = document.getElementById('overlay');
        const loader = document.getElementById('loader');
        const form = document.getElementById('passwordForm');
        const message = document.getElementById('message');
        const token = localStorage.getItem('token');

        function showMessage(text, type = 'success') {
            message.textContent = text;
            message.className = `message ${type}`;
        }

        function setLoading(isLoading) {
            if (overlay) overlay.style.display = isLoading ? 'block' : 'none';
            if (loader) loader.style.display = isLoading ? 'block' : 'none';
        }

        document.getElementById('cancelBtn').addEventListener('click', () => {
            window.location.href = 'client.html';
        });

        if (!token) {
            alert('Vous devez être connecté pour changer votre mot de passe.');
            window.location.href = 'connexion.html';
        }

        // Gestion de l'affichage/masquage des mots de passe
        document.querySelectorAll('.password-toggle').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const icon = button.querySelector('i');

                if (!input || !icon) return;

                const isPassword = input.type === 'password';//on vérifie si le type actuel est "password"
                input.type = isPassword ? 'text' : 'password';//on change le type en "text" si c'est actuellement "password", sinon on le remet à "password"
                icon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';//
            });
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            setLoading(true);

            const oldPassword = document.getElementById('oldPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (newPassword !== confirmPassword) {
                showMessage('La confirmation du nouveau mot de passe ne correspond pas.', 'error');
                setLoading(false);
                return;
            }

            const payload = {
                oldPassword,
                newPassword,
                confirmPassword
            };

            try {
                let response = await fetch('http://localhost:3000/api/auth/me/password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const text = await response.text().catch(() => '');
                    throw new Error(text || 'Le changement de mot de passe a échoué.');
                }

                showMessage('Votre mot de passe a été changé avec succès. Retour automatique...', 'success');
                setTimeout(() => {
                    window.location.href = 'client.html';
                }, 1400);
            } catch (error) {
                showMessage(error.message || 'Une erreur inattendue est survenue.', 'error');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
