<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Produit | Shopy-Cloths</title>
    <script src="../js/url.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../css/client.css">
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5567d8;
            --accent: #43e97b;
            --surface: #ffffff;
            --surface-soft: #f5f7ff;
            --border: rgba(113, 130, 182, 0.18);
            --text: #1d2433;
            --text-light: #5a6378;
            --shadow: 0 20px 50px rgba(31, 41, 55, 0.12);
            --shadow-soft: 0 10px 22px rgba(102, 126, 234, 0.12);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --transition: all 0.28s ease;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at top left, rgba(102, 126, 234, 0.15), transparent 25%),
                        linear-gradient(180deg, #0f172a 0%, #111827 100%);
            color: var(--text);
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
        }

        #main {
            min-height: 100vh;
            padding: 32px 20px 60px;
        }

        .detail-shell {
            max-width: 1220px;
            margin: 0 auto;
        }

        .btn-retour {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gradient-primary);
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 999px;
            font-weight: 700;
            margin-bottom: 28px;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
        }

        .btn-retour:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.25);
        }

        .detail-container {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 42px;
            padding: 28px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeInUp 0.45s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail-gallery {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 8px;
        }

        .main-image-frame {
            position: relative;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08), rgba(118, 75, 162, 0.04));
            border: 1px solid var(--border);
            border-radius: 22px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3);
        }

        .main-image-frame::before {
            content: "";
            position: absolute;
            inset: 25px;
            border-radius: 18px;
            border: 1px solid rgba(102, 126, 234, 0.08);
            pointer-events: none;
        }

        .main-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .main-image-frame:hover img {
            transform: scale(1.03);
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text);
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
            transition: var(--transition);
            z-index: 2;
        }

        .gallery-nav:hover {
            background: white;
            transform: translateY(-50%) scale(1.04);
        }

        .gallery-nav.prev {
            left: -8px;
        }

        .gallery-nav.next {
            right: -8px;
        }

        .gallery-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }

        .thumbs {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .thumb {
            padding: 0;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            height: 92px;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            padding: 8px 4px;
        }

        .badge {
            display: inline-flex;
            align-self: flex-start;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(102, 126, 234, 0.12);
            color: var(--primary-dark);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .detail-info h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 3.2rem);
            line-height: 1.1;
            color: var(--text);
            letter-spacing: -0.04em;
        }

        .merchant-line {
            margin: 0;
            color: var(--text-light);
            font-weight: 600;
            background: var(--surface-soft);
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .price {
            margin: 0;
            font-size: clamp(1.8rem, 2.5vw, 2.8rem);
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .description {
            margin: 0;
            color: var(--text-light);
            background: #f8f9fc;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 20px;
            line-height: 1.75;
            font-size: 1rem;
        }

        .ajouter-panier {
            margin-top: 8px;
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 1rem 1.2rem;
            background: var(--gradient-primary);
            color: white;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: 0 16px 30px rgba(102, 126, 234, 0.25);
            transition: var(--transition);
        }

        .ajouter-panier:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px rgba(102, 126, 234, 0.3);
        }

        .ajouter-panier:active {
            transform: translateY(0);
        }

        .ajouter-panier:disabled {
            background: #cbd5e1;
            color: #475569;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.9;
        }

        .ajouter-panier:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        /* ============================================
           SECTION AVIS CLIENTS
           ============================================ */
        .reviews-section {
            max-width: 1220px;
            margin: 26px auto 0;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 22px;
            box-shadow: var(--shadow-soft);
            padding: 24px 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .reviews-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .reviews-header h2 {
            margin: 0;
            font-size: clamp(1.3rem, 2vw, 1.9rem);
            color: var(--text);
        }

        .rating-summary {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            color: var(--text-light);
            font-weight: 700;
        }

        .rating-summary strong {
            color: var(--primary-dark);
            font-size: 1.2rem;
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .review-card {
            background: #f9f9ff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 18px;
        }

        .review-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .review-author {
            font-weight: 800;
            color: var(--text);
        }

        .review-verified {
            color: #0d8a5e;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .review-stars {
            color: #f7b731;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .review-comment {
            margin: 0;
            color: var(--text-light);
            line-height: 1.7;
        }

        .review-form {
            border-top: 1px solid var(--border);
            padding-top: 22px;
        }

        .review-form h3 {
            margin: 0 0 14px;
            font-size: 1.15rem;
            color: var(--text);
        }

        .star-rating {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: center;
        }

        .star-rating label {
            position: relative;
            cursor: pointer;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            transition: var(--transition);
            background: transparent;
        }

        .star-rating label:hover,
        .star-rating label.selected {
            background: rgba(245, 179, 1, 0.08);
        }

        .star-rating input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .star-rating i {
            font-size: clamp(1.4rem, 3vw, 1.9rem);
            color: #d9deea;
            transition: var(--transition);
        }

        .star-rating label:hover i,
        .star-rating label.selected i {
            color: #f5b301;
            text-shadow: 0 0 8px rgba(245, 179, 1, 0.3);
            transform: scale(1.06);
        }

        #review-comment-text {
            width: 100%;
            min-height: 100px;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            resize: vertical;
            font-family: inherit;
            font-size: 0.98rem;
            color: var(--text);
            background: #fff;
            margin-bottom: 14px;
        }

        #review-comment-text:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        #submit-review-btn {
            border: none;
            background: var(--gradient-primary);
            color: white;
            font-weight: 800;
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        #submit-review-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(102, 126, 234, 0.22);
        }

        @media (max-width: 900px) {
            .detail-container {
                grid-template-columns: 1fr;
                gap: 22px;
                padding: 18px;
            }

            .detail-info {
                padding: 0;
                gap: 10px;
            }
        }

        @media (max-width: 640px) {
            #main {
                padding: 14px 12px 32px;
            }

            .btn-retour {
                width: 100%;
                justify-content: center;
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }

            .star-rating {
                justify-content: center;
                gap: 6px;
            }

            .star-rating label {
                width: 38px;
                height: 38px;
            }

            .detail-container {
                padding: 12px;
                border-radius: 16px;
                gap: 16px;
            }

            .detail-gallery {
                gap: 10px;
                padding: 0;
            }

            .main-image-frame {
                aspect-ratio: 1 / 1.08;
                border-radius: 16px;
            }

            .main-image-frame::before {
                inset: 14px;
            }

            .gallery-nav {
                width: 36px;
                height: 36px;
                font-size: 1.5rem;
            }

            .gallery-nav.prev {
                left: 8px;
            }

            .gallery-nav.next {
                right: 8px;
            }

            .thumbs {
                gap: 8px;
            }

            .thumb {
                height: 68px;
                border-radius: 10px;
            }

            .detail-info h1 {
                font-size: 1.6rem;
            }

            .badge {
                font-size: 0.72rem;
                padding: 7px 10px;
            }

            .merchant-line,
            .description {
                padding: 12px 13px;
                font-size: 0.9rem;
                line-height: 1.5;
            }

            .price {
                font-size: 1.8rem;
            }

            .ajouter-panier {
                padding: 0.85rem 1rem;
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>shopy-cloths</h1>
        <h2>Fiche Produit détaillée</h2>
    </header>

    <main id="main">
        <div class="detail-shell">
            <a href="client.html" class="btn-retour">← Retour au catalogue</a>

            <div class="detail-container" id="product-content">
                <div class="detail-gallery">
                    <div class="main-image-frame">
                        <button type="button" class="gallery-nav prev" aria-label="Image précédente">&#8249;</button>
                        <img id="product-img" src="" alt="Chargement...">
                        <button type="button" class="gallery-nav next" aria-label="Image suivante">&#8250;</button>
                    </div>
                    <div class="thumbs" id="product-thumbs"></div>
                </div>

                <div class="detail-info">
                    <span class="badge">Produit</span>
                    <h1 id="product-name">Chargement...</h1>
                    <p id="product-vendeur" class="merchant-line">Boutique Officielle</p>
                    <p class="price" id="product-price">-- FC</p>
                    <div class="description" id="product-desc">
                        Veuillez patienter pendant que nous récupérons les détails du produit...
                    </div>
                    <button class="ajouter-panier" id="add-to-cart-btn">Ajouter au panier</button>
                </div>
            </div>

            <section class="reviews-section" aria-labelledby="reviews-title">
                <div class="reviews-header">
                    <h2 id="reviews-title">Avis clients</h2>
                    <div class="rating-summary">
                        <strong id="average-score">0.0</strong>
                        <span>/ 5</span>
                        <span id="total-reviews-count">0</span>
                        <span>avis</span>
                    </div>
                </div>

                <div id="reviews-container" class="reviews-list"></div>

                <form id="review-form" class="review-form">
                    <h3>Laissez votre avis</h3>

                    <div class="star-rating" aria-label="Choisir une note">
                        <label>
                            <input type="radio" name="rating" value="1">
                            <i class="fa-solid fa-star"></i>
                        </label>
                        <label>
                            <input type="radio" name="rating" value="2">
                            <i class="fa-solid fa-star"></i>
                        </label>
                        <label>
                            <input type="radio" name="rating" value="3">
                            <i class="fa-solid fa-star"></i>
                        </label>
                        <label>
                            <input type="radio" name="rating" value="4">
                            <i class="fa-solid fa-star"></i>
                        </label>
                        <label>
                            <input type="radio" name="rating" value="5">
                            <i class="fa-solid fa-star"></i>
                        </label>
                    </div>

                    <textarea
                        id="review-comment-text"
                        placeholder="Partagez votre avis sur ce produit..."
                        aria-label="Commentaire de l'avis"
                    ></textarea>

                    <button type="submit" id="submit-review-btn">Envoyer mon avis</button>
                </form>
            </section>
        </div>
    </main>

    <script>
        function obtenirPanier() {
            const panierData = localStorage.getItem('panier_shopy');
            return panierData ? JSON.parse(panierData) : [];
        }

        function sauvegarderPanier(panier) {
            localStorage.setItem('panier_shopy', JSON.stringify(panier));
            mettreAJourCompteurPanier();
        }

        function ajouterAuPanier(id, nom, prix, image, vendeurId) {
            let panier = obtenirPanier();
            const produitExistant = panier.find(item => item.id === id);

            if (produitExistant) {
                produitExistant.quantite += 1;
            } else {
                panier.push({
                    id: id,
                    nom: nom,
                    prix: parseFloat(String(prix).replace(/[^\d.]/g, '').replace(',', '.')) || 0,
                    image: image,
                    quantite: 1,
                    vendeurId: vendeurId
                });
            }

            sauvegarderPanier(panier);
        }

        function mettreAJourCompteurPanier() {
            const panier = obtenirPanier();
            const totalArticles = panier.reduce((acc, item) => acc + (Number(item.quantite) || 0), 0);
            const btnPanier = document.getElementById('panier');

            if (btnPanier) {
                btnPanier.innerText = `Panier (${totalArticles})`;
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let galleryImages = [];
        let currentImageIndex = 0;

        function normalizeImage(value) {
            if (!value || typeof value !== 'string') return '';
            return value.trim();
        }

        function getProductImages(product) {
            const images = [
                product.image,
                product.image1,
                product.image2,
                product.image3
            ].map(normalizeImage).filter(Boolean);

            return images.length ? images : [''];
        }

        function updateGallery() {
            const mainImage = document.getElementById('product-img');
            const thumbs = document.querySelectorAll('.thumb');
            const prevBtn = document.querySelector('.gallery-nav.prev');
            const nextBtn = document.querySelector('.gallery-nav.next');

            if (!galleryImages.length || !mainImage) return;

            mainImage.src = galleryImages[currentImageIndex];
            mainImage.alt = `Image ${currentImageIndex + 1} du produit`;

            thumbs.forEach((thumb, index) => {
                thumb.classList.toggle('active', index === currentImageIndex);
            });

            if (prevBtn) prevBtn.disabled = galleryImages.length <= 1;
            if (nextBtn) nextBtn.disabled = galleryImages.length <= 1;
        }

        function buildGallery(images) {
            const thumbsContainer = document.getElementById('product-thumbs');
            if (!thumbsContainer) return;

            thumbsContainer.innerHTML = '';

            images.forEach((src, index) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'thumb' + (index === currentImageIndex ? ' active' : '');
                button.setAttribute('aria-label', `Voir l'image ${index + 1}`);

                const img = document.createElement('img');
                img.src = src;
                img.alt = `Produit - image ${index + 1}`;
                button.appendChild(img);

                button.addEventListener('click', () => {
                    currentImageIndex = index;
                    updateGallery();
                });

                thumbsContainer.appendChild(button);
            });

            updateGallery();
        }

        function attachGalleryNavigation() {
            const prevBtn = document.querySelector('.gallery-nav.prev');
            const nextBtn = document.querySelector('.gallery-nav.next');

            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    if (!galleryImages.length) return;
                    currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
                    updateGallery();
                    buildGallery(galleryImages);
                });
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    if (!galleryImages.length) return;
                    currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
                    updateGallery();
                    buildGallery(galleryImages);
                });
            }
        }

        async function getProductDetails() {
            if (!productId) {
                window.location.href = 'client.html';
                return;
            }

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/products/${productId}`);

                if (!response.ok) {
                    throw new Error('Produit introuvable');
                }

                const product = await response.json();
                galleryImages = getProductImages(product);
                currentImageIndex = 0;

                const productName = document.getElementById('product-name');
                const productPrice = document.getElementById('product-price');
                const productDescription = document.getElementById('product-desc');
                const productSeller = document.getElementById('product-vendeur');
                const addToCartButton = document.getElementById('add-to-cart-btn');
                const stockDisponible = Number(product.stock);

                productName.innerText = product.nom || 'Produit';
                productPrice.innerText = `${Number(parseFloat(String(product.prix || '0').replace(/[^\d,.-]/g, '').replace(',', '.')) || 0).toLocaleString('fr-FR')} FC`;
                productDescription.innerText = product.description || 'Aucune description disponible pour ce produit.';

                const vendeur = product?.vendeurId?.boutique?.nomBoutique || product?.vendeurId?.name || product?.vendeur || 'Boutique Officielle';
                productSeller.innerText = `Vendu par : ${vendeur}`;

                if (galleryImages.length) {
                    buildGallery(galleryImages);
                }

                // Un stock nul ou négatif rend l'ajout au panier impossible.
                if (stockDisponible <= 0) {
                    addToCartButton.disabled = true;
                    addToCartButton.setAttribute('aria-disabled', 'true');
                    addToCartButton.innerText = 'Rupture de stock';
                } else {
                    addToCartButton.disabled = false;
                    addToCartButton.removeAttribute('aria-disabled');
                    addToCartButton.onclick = () => {
                    const prix = parseFloat(String(product.prix || '0').replace(/[^\d,.-]/g, '').replace(',', '.')) || 0;
                    ajouterAuPanier(
                        product._id,
                        product.nom,
                        prix,
                        galleryImages[currentImageIndex] || product.image,
                        product.vendeurId
                    );

                    const btn = document.getElementById('add-to-cart-btn');
                    btn.innerText = 'Ajouté ! ✅';
                    setTimeout(() => btn.innerText = 'Ajouter au panier', 2000);
                    };
                }

            } catch (error) {
                console.error('Erreur lors de la récupération du produit :', error);
                document.getElementById('product-content').innerHTML = `
                    <div style="text-align:center; width:100%; padding: 30px;">
                        <h2>Oups ! Ce produit n'existe pas.</h2>
                        <a href="client.html">Retourner à la boutique</a>
                    </div>
                `;
            }
        }

        // ============================================
        // GESTION DES AVIS CLIENTS
        // ============================================
        const reviewProductId = new URLSearchParams(window.location.search).get('id');

        // Fonction : afficher les avis et la moyenne du produit
        async function fetchAndDisplayReviews() {
            const averageScore = document.getElementById('average-score');
            const totalReviewsCount = document.getElementById('total-reviews-count');
            const reviewsContainer = document.getElementById('reviews-container');

            if (!reviewProductId || !averageScore || !totalReviewsCount || !reviewsContainer) {
                return;
            }

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/reviews/product/${reviewProductId}`);

                if (!response.ok) {
                    throw new Error('Impossible de charger les avis');
                }

                const data = await response.json();
                const moyenne = Number(data.moyenne || 0).toFixed(1);
                const totalAvis = Number(data.totalAvis || 0);

                averageScore.innerText = moyenne;
                totalReviewsCount.innerText = totalAvis;

                if (!data.reviews || data.reviews.length === 0) {
                    reviewsContainer.innerHTML = '<p>Aucun avis pour le moment sur ce produit.</p>';
                    return;
                }

                reviewsContainer.innerHTML = data.reviews.map(review => {
                    const stars = '★'.repeat(Number(review.rating || 0)) + '☆'.repeat(5 - Number(review.rating || 0));
                    const authorName = review.userId
                        ? `${review.userId.prenom || ''} ${review.userId.nom || ''}`.trim() || 'Client ShopyCloth'
                        : 'Client ShopyCloth';

                    return `
                        <div class="review-card">
                            <div class="review-card-header">
                                <span class="review-author">${authorName}</span>
                                <span class="review-verified">✔ Achat vérifié</span>
                            </div>
                            <div class="review-stars">${stars}</div>
                            <p class="review-comment">${review.comment || 'Aucun commentaire'}</p>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Erreur lors du chargement des avis :', error);
                reviewsContainer.innerHTML = '<p>Les avis ne sont pas disponibles pour le moment.</p>';
            }
        }

        // Fonction : envoyer un nouvel avis avec le token JWT
        async function submitReview(event) {
            event.preventDefault();

            const selectedStar = document.querySelector('input[name="rating"]:checked');
            const commentText = document.getElementById('review-comment-text');
            const submitButton = document.getElementById('submit-review-btn');

            if (!selectedStar) {
                alert('Veuillez choisir une note avant d’envoyer votre avis.');
                return;
            }

            if (!commentText || !commentText.value.trim()) {
                alert('Veuillez écrire un commentaire avant de soumettre votre avis.');
                return;
            }

            const payload = {
                productId: reviewProductId,
                rating: Number(selectedStar.value),
                comment: commentText.value.trim()
            };

            try {
                const response = await fetch(`${CONFIG.API_BASE_URL}/api/reviews`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Impossible d’envoyer l’avis');
                }

                alert('Merci ! ' + (result.message || 'Votre avis a bien été ajouté.'));
                commentText.value = '';
                document.querySelectorAll('input[name="rating"]').forEach(input => input.checked = false);
                submitButton.innerText = 'Avis envoyé ✓';
                setTimeout(() => {
                    submitButton.innerText = 'Envoyer mon avis';
                }, 1800);

                fetchAndDisplayReviews();

            } catch (error) {
                console.error('Erreur lors de l’envoi de l’avis :', error);
                alert('Erreur : ' + error.message);
            }
        }

        // Fonction : appliquer le style visuel au sélecteur d'étoiles selon la note choisie
        function updateStarSelection() {
            const inputs = document.querySelectorAll('input[name="rating"]');
            const labels = document.querySelectorAll('.star-rating label');

            labels.forEach(label => label.classList.remove('selected'));

            let checkedValue = 0;
            inputs.forEach(input => {
                if (input.checked) {
                    checkedValue = Number(input.value);
                }
            });

            labels.forEach((label, index) => {
                const value = Number(label.querySelector('input').value);
                if (value <= checkedValue) {
                    label.classList.add('selected');
                }
            });
        }

        // Démarrage au chargement de la page
        window.addEventListener('DOMContentLoaded', () => {
            attachGalleryNavigation();
            getProductDetails();
            mettreAJourCompteurPanier();
            fetchAndDisplayReviews();

            document.querySelectorAll('input[name="rating"]').forEach(input => {
                input.addEventListener('change', updateStarSelection);
            });

            const reviewForm = document.getElementById('review-form');
            if (reviewForm) {
                reviewForm.addEventListener('submit', submitReview);
            }
        });
    </script>
</body>
</html>
