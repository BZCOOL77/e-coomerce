<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Produit | Shopy-Cloths</title>
    <link rel="stylesheet" href="client.css">
    <style>
        /* ============================================
           VARIABLES & RESET DÉTAIL
           ============================================ */
        :root {
            --primary: #667eea;
            --primary-dark: #5567d8;
            --accent: #43e97b;
            --danger: #f5576c;
            --surface: #ffffff;
            --border: rgba(224, 224, 224, 0.5);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.08);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: radial-gradient(circle at top left, rgba(102, 126, 234, 0.1), transparent 30%),
                        linear-gradient(180deg, #0f0f1e 0%, #1a1a2e 100%);
        }

        /* ============================================
           MAIN CONTAINER
           ============================================ */
        #main {
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .btn-retour {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--primary);
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            border: none;
            cursor: pointer;
        }

        .btn-retour:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        /* ============================================
           DETAIL CONTAINER
           ============================================ */
        .detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            padding: 3rem;
            max-width: 1200px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: var(--shadow);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================
           PRODUCT IMAGE SECTION
           ============================================ */
        .detail-image {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .detail-image::before {
            content: '';
            position: absolute;
            top: -2rem;
            right: -2rem;
            width: 300px;
            height: 300px;
            background: var(--gradient-primary);
            border-radius: 50%;
            opacity: 0.1;
            z-index: -1;
        }

        .detail-image img {
            max-width: 100%;
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.15);
            transition: var(--transition);
            object-fit: contain;
        }

        .detail-image img:hover {
            transform: scale(1.02);
        }

        /* ============================================
           PRODUCT INFO SECTION
           ============================================ */
        .detail-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .detail-info h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            margin: 0 0 1rem 0;
            letter-spacing: -0.5px;
            color: #1a1a1a;
            line-height: 1.2;
        }

        .detail-info .price {
            font-size: 2rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
        }

        .detail-info .price::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 2rem;
            background: var(--primary);
            margin-right: 0.75rem;
            border-radius: 2px;
            vertical-align: middle;
        }

        /* ============================================
           RATING & STATS
           ============================================ */
        .product-stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================
           DESCRIPTION
           ============================================ */
        .detail-info .description {
            font-size: 1rem;
            line-height: 1.7;
            color: #555;
            margin-bottom: 2rem;
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid var(--primary);
        }

        /* ============================================
           QUANTITY SELECTOR
           ============================================ */
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            background: #f5f5f5;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            width: fit-content;
        }

        .quantity-selector label {
            font-weight: 600;
            color: #333;
        }

        .quantity-selector input {
            width: 60px;
            padding: 0.5rem 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            transition: var(--transition);
        }

        .quantity-selector input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* ============================================
           BUTTONS
           ============================================ */
        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .ajouter-panier,
        .btn-wishlist {
            flex: 1;
            min-width: 150px;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ajouter-panier {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .ajouter-panier:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .ajouter-panier:active {
            transform: translateY(0);
        }

        .btn-wishlist {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-wishlist:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        /* ============================================
           FEATURES
           ============================================ */
        .product-features {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid var(--border);
        }

        .features-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            list-style: none;
            margin: 1rem 0 0 0;
            padding: 0;
        }

        .features-list li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
            color: #555;
        }

        .features-list li::before {
            content: '✓';
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            font-weight: 800;
            flex-shrink: 0;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .detail-container {
                grid-template-columns: 1fr;
                gap: 2rem;
                padding: 2rem 1.5rem;
                border-radius: 16px;
            }

            .detail-image::before {
                width: 200px;
                height: 200px;
                top: -1rem;
                right: -1rem;
            }

            .detail-info h1 {
                font-size: 1.8rem;
            }

            .detail-info .price {
                font-size: 1.5rem;
            }

            .product-stats {
                gap: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .ajouter-panier,
            .btn-wishlist {
                width: 100%;
            }

            .features-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            #main {
                padding: 1rem;
            }

            .detail-container {
                padding: 1.5rem 1rem;
            }

            .detail-info h1 {
                font-size: 1.5rem;
            }

            .detail-info .price {
                font-size: 1.3rem;
            }

            .detail-info .description {
                padding: 1rem;
                font-size: 0.9rem;
            }

            .quantity-selector {
                width: 100%;
                justify-content: space-between;
            }

            .quantity-selector input {
                flex-grow: 1;
            }

            .product-stats {
                flex-wrap: wrap;
                gap: 1rem;
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>shopy-cloths</h1>
        <h2>Fiche Produit détaillée</h2>
    </header>

    <main id="main">
        <div style="padding: 20px;">
            <a href="client.html" class="btn-retour">← Retour au catalogue</a>

            <div class="detail-container" id="product-content">
                <div class="detail-image">
                    <img id="product-img" src="" alt="Chargement...">
                </div>

                <div class="detail-info">
                    <h1 id="product-name">Chargement...</h1>
                    <p class="price" id="product-price">-- €</p>
                    <div class="description" id="product-desc">
                        Veuillez patienter pendant que nous récupérons les détails du produit...
                    </div>
                    <button class="ajouter-panier" id="add-to-cart-btn">Ajouter au panier</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 1. On commence par isoler l'ID du produit présent dans l'URL
// Exemple : detail.html?id=65a123... -> on récupère "65a123..."
const urlParams = new URLSearchParams(window.location.search);
const productId = urlParams.get('id');

// 2. Fonction pour récupérer les données du produit via l'API
async function getProductDetails() {
    // Si aucun ID n'est présent, on redirige vers l'accueil
    if (!productId) {
        window.location.href = 'client.html';
        return;
    }

    try {
        // On appelle la route "Get One Product" de ton backend
        const response = await fetch(`http://localhost:3000/api/products/${productId}`);
        
        if (!response.ok) {
            throw new Error("Produit introuvable");
        }

        const product = await response.json();

        // 3. On injecte les données reçues dans le HTML
        document.getElementById('product-img').src = product.image;
        document.getElementById('product-img').alt = product.nom;
        document.getElementById('product-name').innerText = product.nom;
        document.getElementById('product-price').innerText = `${product.prix} €`;
        document.getElementById('product-desc').innerText = product.description;

        // On peut aussi attacher l'ID au bouton panier de cette page
        document.getElementById('add-to-cart-btn').onclick = () => {
            alert(`Produit ${product.nom} ajouté au panier ! 🛒`);
        };

    } catch (error) {
        console.error("Erreur lors de la récupération du produit :", error);
        document.getElementById('product-content').innerHTML = `
            <div style="text-align:center; width:100%;">
                <h2>Oups ! Ce produit n'existe pas.</h2>
                <a href="client.html">Retourner à la boutique</a>
            </div>
        `;
    }
}

// 4. On lance la fonction au chargement de la page
window.onload = getProductDetails;
    </script>
</body>
</html>
