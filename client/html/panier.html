<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier | Shopy-Cloths</title>

    <script src="../js/url.js"></script>
    <link rel="stylesheet" href="../css/panier.css">
</head>
<body>

    <header>
        <h1>shopy-cloths</h1>
        <h2>Votre Panier</h2>
    </header>

    <main>
        <div style="padding: 20px; max-width: 1200px; margin: auto;">
            <a href="client.html" class="client-return-link">Continuer le shopping</a>
        </div>

        <div class="panier-wrapper">
            <div class="panier-liste" id="liste-panier">
                <p>Votre panier est vide...</p>
            </div>

            <div class="panier-resume">
                <h3>Résumé de la commande</h3>
                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
                <div class="resume-ligne">
                    <span>Sous-total (la tva est deja incluse)</span>
                    <span id="sous-total">0.00 €</span>
                </div>
                <div class="resume-ligne">
                    <span>Livraison</span>
                    <span>Gratuite</span>
                </div>
                <div class="resume-ligne total-final">
                    <span>Total TTC</span>
                    <span id="total-global">0.00 €</span>
                </div>

                <div class="adresse-livraison">
                    <h4>Adresse de livraison</h4>
                    
                    <label>Quartier <input id="adresse-quartier" type="text" placeholder="Quartier" required></label>
                    <label>Avenue <input id="adresse-avenue" type="text" placeholder="Avenue" required></label>
                    <label>Référence <input id="adresse-reference" type="text" placeholder="(ex:hotel lubumbashi)"></label>
                    <label>Numéro <input id="adresse-parcelle" type="number" placeholder="Numéro "></label>
                    <label>Téléphone <input id="adresse-telephone" type="text" placeholder="Téléphone" required></label>
                    <!-- selection commune-->
                    <label for="commune"> indiquez votre commune :</label>
                    <select id="adresse-commune" name="commune" required>
                    <option value="" disabled selected>-- Sélectionnez une commune --</option>
                    <option value="LUBUMBASHI">Lubumbashi</option>
                    <option value="KATUBA">katuba</option>
                    <option value="KENYA">kenya</option>
                    <option value="KAMPEMBA">kampemba</option>
                    <option value="ANNEXE">annexe</option>
                    <option value="RUASHI">ruashi</option>
                    <option value="KAMALONDO">kamalondo</option>
                    <!-- Ajoutez d'autres communes selon vos besoins -->
                    </select>
                    <!-- Bouton pour utiliser la géolocalisation -->
                    <button type="button" id="btnGeoloc" class="btn-secondary" style="margin-top: 0.5rem;">
                    📍 Utiliser ma position GPS exacte
                    </button>
                <span id="geoStatus" style="font-size: 0.85rem; color: #6a7280; display: block; margin-top: 0.3rem;"></span>
                </div>

                <button class="btn-commander" onclick="validerPanierEtCommander()">Passer à la caisse</button>
            </div>
        </div>
    </main>

    <script>
        // 1. Initialisation : Charger le panier au démarrage
function chargerPanier() {
    const panier = JSON.parse(localStorage.getItem('panier_shopy')) || [];
    const container = document.getElementById('liste-panier');
    
    if (panier.length === 0) {
        container.innerHTML = "<p style='text-align:center; padding: 20px;'>Votre panier est vide. Il est temps de faire chauffer la carte ! 💳</p>";
        calculerTotal(panier);
        return;
    }

    // 2. On génère le HTML pour chaque produit
    container.innerHTML = panier.map(item => `
        <div class="panier-item" data-id="${item.id}" data-vendeur="${item.vendeurId}">
            <img src="${item.image}" alt="${item.nom}">
            <div class="item-infos">
                <h3>${item.nom}</h3>
                <p class="prix">${item.prix.toFixed(2)} €</p>
                <div class="item-quantite">
                    <button class="btn-qty" onclick="modifierQuantite('${item.id}', -1)">-</button>
                    <span>${item.quantite}</span>
                    <button class="btn-qty" onclick="modifierQuantite('${item.id}', 1)">+</button>
                </div>
                <button class="btn-supprimer" onclick="supprimerArticle('${item.id}')">Supprimer</button>
            </div>
            <div style="font-weight: bold;">
                ${(item.prix * item.quantite).toFixed(2)} €
            </div>
        </div>
    `).join('');

    calculerTotal(panier);
}

// 3. Fonction pour modifier la quantité (+ ou -)
function modifierQuantite(id, delta) {
    let panier = JSON.parse(localStorage.getItem('panier_shopy'));
    const produit = panier.find(item => item.id === id);

    if (produit) {
        produit.quantite += delta;
        // Si la quantité tombe à 0, on supprime l'article
        if (produit.quantite <= 0) {
            return supprimerArticle(id);
        }
        localStorage.setItem('panier_shopy', JSON.stringify(panier));
        chargerPanier(); // On rafraîchit l'affichage
    }
}

// 4. Fonction pour supprimer un article
function supprimerArticle(id) {
    let panier = JSON.parse(localStorage.getItem('panier_shopy'));
    panier = panier.filter(item => item.id !== id);
    localStorage.setItem('panier_shopy', JSON.stringify(panier));
    chargerPanier();
}

// 5. Calculer le total final
function calculerTotal(panier) {
    const total = panier.reduce((acc, item) => acc + (item.prix * item.quantite), 0);
    document.getElementById('sous-total').innerText = `${total.toFixed(2)} €`;
    document.getElementById('total-global').innerText = `${total.toFixed(2)} €`;
}

// 6. Simulation de commande (Version corrigée et groupée)
async function validerPanierEtCommander() {
    let panier = JSON.parse(localStorage.getItem('panier_shopy')) || [];
    if (panier.length === 0) {
        alert("Votre panier est vide ! 🛒");
        return;
    }

    // 🚀 UNIFICATION : On prépare TOUS les articles en un seul tableau clean
    const articlesToProcess = [];

    for (const item of panier) {
        const produitId = String(item.id);
        if (!produitId || produitId === 'undefined' || produitId === 'null') {
            console.warn("Produit invalide ignoré", item);
            continue;
        }

        articlesToProcess.push({
            produitId: produitId,
            quantite: Number(item.quantite) > 0 ? Number(item.quantite) : 1
        });
    }

    if (articlesToProcess.length === 0) {
        alert("Aucun article valide dans le panier.");
        return;
    }

    // recuperation des info de geolocalisation
    let clientLat = null;
    let clientLng = null;

    document.getElementById('btnGeoloc').addEventListener('click', () => {
    const status = document.getElementById('geoStatus');

    if (!navigator.geolocation) {
        status.textContent = "La géolocalisation n'est pas supportée par votre navigateur.";
        return;
    }

    status.textContent = "Recherche de votre position...";

    navigator.geolocation.getCurrentPosition(
        (position) => {
            clientLat = position.coords.latitude;
            clientLng = position.coords.longitude;
            status.textContent = `✅ Position capturée ! (${clientLat.toFixed(4)}, ${clientLng.toFixed(4)})`;
            status.style.color = "#28a745";
        },
        (error) => {
            status.textContent = "Impossible de récupérer votre position. Saisissez votre adresse manuellement.";
            status.style.color = "#dc3545";
        },
        { enableHighAccuracy: true } // Active le GPS haute précision du smartphone
    );
});



    const commune = document.getElementById('adresse-commune').value;
    const quartier = document.getElementById('adresse-quartier').value.trim();
    const avenue = document.getElementById('adresse-avenue').value.trim();
    const reference = document.getElementById('adresse-reference').value.trim();
    const numeroParcelle = document.getElementById('adresse-parcelle').value.trim();
    const telephone = document.getElementById('adresse-telephone').value.trim();
    const latitude = clientLat;
    const longitude = clientLng;

    

    const adresseLivraison = {
        commune,
        quartier,
        avenue,
        reference: reference || undefined,
        numeroParcelle: numeroParcelle || undefined,
        telephone,
        latitude,
        longitude
    };

    const token = localStorage.getItem('token');
    if (!token) {
        alert("Veuillez vous connecter pour passer la commande.");
        return;
    }

    try {
        // 📡 UNE SEULE REQUÊTE HTTP pour tout le panier
        const response = await fetch(`${CONFIG.API_BASE_URL}/api/orders`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ articles: articlesToProcess, adresseLivraison })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
            // 🎉 Succès total : on vide complètement le panier local
            localStorage.setItem('panier_shopy', JSON.stringify([]));
            alert("🎉 Toutes vos commandes ont été validées avec succès !");
            window.location.href = 'mes-commandes.html';
        } else {
            // Gestion des erreurs de stock ou autres renvoyées par le backend
            alert(`❌ Impossible de valider la commande : ${data.error || 'Erreur serveur'}`);
        }

    } catch (error) {
        console.error("Erreur réseau globale", error);
        alert("❌ Erreur réseau. Impossible de contacter le serveur.");
    }
}

    

// Lancer le chargement
window.onload = chargerPanier;
    </script>
</body>
</html>
