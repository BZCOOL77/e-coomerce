    <script>
        // Variable globale qui mémorise l'onglet ou le filtre actuellement sélectionné.
// L'onglet affiché par défaut correspond aux commandes qui attendent un traitement.
let filtreActuel = 'en-attente';
let termeRecherche = '';//le terme de recherche saisi par l'utilisateur dans la barre de recherche

// Conserve les commandes chargées afin de pouvoir marquer les colis historiques
// comme lus lorsque l'utilisateur ouvre l'onglet Historique.
let commandesChargees = [];

// Clé utilisée par le navigateur pour mémoriser les colis historiques déjà lus.
const CLE_HISTORIQUE_LU = 'commandes-vendeur-historique-lu';

// Normalise le texte saisi dans la barre de recherche pour pouvoir
// comparer les valeurs de manière fiable, même si l'utilisateur tape
// des accents, des majuscules ou des tirets.
function normaliserTexteRecherche(value) {
    return (value || '')
        .toString()
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[-_]/g, ' ')
        .replace(/\s+/g, ' ');
}

// Assigne un rang à chaque statut pour guider la progression du colis
// dans l’interface vendeur sans ignorer les étapes intermédiaires.
function getStatusRank(statut) {
    const statutNorm = normaliserStatut(statut);

    if (!statutNorm) return 0;
    if (['annulee', 'annulee par acheteur', 'annulee par l acheteur'].includes(statutNorm)) return 0;
    if (statutNorm === 'en attente') return 1;//si le statut est "en attente", on le considère comme le premier rang
    if (statutNorm === 'en cours') return 2;
    if (statutNorm === 'expediee') return 3;
    if (['attribueealivreur', 'attribuéeAlivreur', 'attribuee au livreur', 'attribueealivreur'].includes(statutNorm)) return 4;
    if (['prise en charge', 'prise encharge', 'priseencharge'].includes(statutNorm)) return 5;
    if (['livree', 'livreee', 'livre'].includes(statutNorm)) return 6;
    if (['echec de livraison', 'echec livraison', 'echec de livraisons', 'echec_de_livraison'].includes(statutNorm)) return 8;

    return 2;
}

// Détermine quel statut doit apparaître ensuite dans le parcours du colis.
// Cela permet d’afficher le bon bouton d’action au vendeur selon l’état actuel.
function nextStatusFor(statut) {
    const rank = getStatusRank(statut);

    switch (rank) {
        case 1:
            return 'En cours';
        case 2:
            return 'expédiée';
        case 3:
            return 'attribuéeAlivreur';
        case 4:
            return 'prise en charge';
        case 5:
            return 'livrée';
        case 8:
            return '';
        default:
            return '';
    }
}

function estStatutLivreur(statut) {
    const statutNorm = normaliserStatut(statut);

    return [
        'attribuéeAlivreur',
        'attribueealivreur',
        'attribuee au livreur',
        'attribuee alivreur',
        'prise en charge',
        'priseencharge',
        'livree',
        'livreee',
        'livre',
        'livrée',
        'echec de livraison',
        'echec livraison',
        'annulee',
        'annulee par acheteur'
    ].includes(statutNorm);
}

// Le vendeur peut annuler uniquement une commande qui est encore sous son
// contrôle. Tous les statuts livreur, terminaux ou inconnus sont refusés.
function peutAnnulerCommande(statut) {
    return ['en attente', 'en cours', 'expediee'].includes(classerStatut(statut));
}

// Vérifie si le bouton de progression peut être affiché au vendeur.
// Dès que le colis est attribué au livreur, le vendeur ne doit plus pouvoir
// faire avancer son statut, même si un statut suivant existe techniquement.
function peutAfficherBoutonProgression(statutActuel, prochainStatut) {
    return Boolean(prochainStatut)
        && !estStatutLivreur(statutActuel)
        && !estStatutLivreur(prochainStatut);
}

// Initialise la recherche locale de la page.
// On écoute les frappes dans l'input et le clic sur le bouton,
// puis on relance le filtrage des commandes affichées.
function initialiserRecherche() {
    const input = document.getElementById('recherche-commande');
    const btn = document.getElementById('btn-recherche-commande');

    if (!input || !btn) return;

    const lancerRecherche = () => {
        termeRecherche = input.value.trim();
        appliquerFiltrage();
    };

    input.addEventListener('input', lancerRecherche);
    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            lancerRecherche();
        }
    });
    btn.addEventListener('click', lancerRecherche);
}

// Charge et affiche les ventes du vendeur, groupées par colisGroupId

    document.getElementById('loader').classList.add('active');

        container.innerHTML = '';

            throw new Error('Format inattendu des commandes');
        }

        // On conserve la réponse courante afin de gérer le badge des historiques.
        commandesChargees = commandes;

        

        commandes.forEach(colis => {
            // Si la réponse est déjà groupée par colis
            
            const articles = Array.isArray(colis.articles) ? colis.articles : [colis];
            const statutGlobal = colis.statutGlobal || colis.statut || 'N/A';
            const nomAcheteur = colis.acheteur ? (colis.acheteur.nom || 'Client inconnu') : (colis.acheteurId ? colis.acheteurId.nom : 'Client inconnu');
            const emailAcheteur = colis.acheteur ? (colis.acheteur.email || '') : (colis.acheteurId ? colis.acheteurId.email : '');
            const idColis = colis.colisGroupId || colis._id;
            const prochainStatutColis = nextStatusFor(statutGlobal);

            let articlesHtml = '';
            articles.forEach(article => {
                const produit = article.produitInfo || article.produitId;
                const imageProduit = produit ? (produit.image || produit.imageUrl || produit.photo || produit.picture) : '';
                const imageSrc = imageProduit
                    ? (imageProduit.startsWith('http://') || imageProduit.startsWith('https://') || imageProduit.startsWith('/')
                        ? imageProduit
                        : imageProduit)//toutes ses acrobatie parce que les données peuvent être très variées, on tente de deviner l'url de l'image, sinon on met une image par défaut
                    : 'chemin/vers/image-par-defaut.jpg';
                const nomProduit = produit ? (produit.nom || produit.title || 'Produit supprimé') : 'Produit supprimé';
                const descriptionProduit = produit ? (produit.description || '') : '';
                const quantite = article.quantite || article.quantite === 0 ? article.quantite : 'N/A';
                const prixProduit = article.prixUnitaire || (produit ? (produit.prix || produit.price) : 'Prix indisponible');
                const statutArticle = article.statutIndividuel || article.statut || 'N/A';
                const orderId = article.orderId || article._id;

                const estAnnuleeParAcheteur = statutArticleClasse === 'annulee par acheteur';
                const peutAnnuler = peutAnnulerCommande(statutArticle);

                articlesHtml += `
                    <div class="ligne-commande commande-card ${estLivree ? 'commande-livree' : ''}" data-statut="${statutArticle}" data-recherche="${normaliserTexteRecherche(`${idColis} ${nomAcheteur} ${nomProduit} ${descriptionProduit}`)}">
                        <div class="col-image commande-header">
                            <img src="${imageSrc}" alt="${nomProduit}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                        </div>
                        <div class="col-infos">
                            <div class="info-main">
                                <span class="info-item"><span class="info-label">Nom :</span> <span class="info-value">${nomProduit}</span></span>
                                <span class="badge statut-${statutArticle.toLowerCase().replace(/ /g,'-')}">${statutArticle}</span>
                            </div>
                            <div class="info-secondary">
                                <span class="info-item"><span class="info-label">Description :</span> <span class="info-value">${descriptionProduit || 'Pas de description'}</span></span>
                                <span class="info-item"><span class="info-label">Prix :</span> <span class="info-value">${prixProduit} €</span></span>
                                <span class="info-item"><span class="info-label">Qté :</span> <span class="info-value">${quantite}</span></span>
                            </div>
                        </div>
                        <div class="actions-statut">
                            ${peutAnnuler ? `
                                <button class="btn-action btn-annuler" onclick="annulerCommande('${orderId}')">
                                    <i class="fa-solid fa-xmark" aria-hidden="true"></i> Annuler
                                </button>
                            ` : (estAnnuleeParAcheteur ? '<span class="annulee-acheteur"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> Annulée par l\'acheteur</span>' : (estAnnulee ? '<span><i class="fa-solid fa-xmark" aria-hidden="true"></i> Vente annulée</span>' : (estLivree ? '<span><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Vente terminée</span>' : '')))}

            // Construit une chaîne de texte de recherche pour chaque colis.
            // Elle contient l'identifiant, le nom de l'acheteur, son email et

            const rechercheBloc = normaliserTexteRecherche(`${idColis} ${nomAcheteur} ${emailAcheteur} ${articles.map(article => {

            container.innerHTML += `
                <section class="colis-block" data-statut="${statutGlobal}" data-recherche="${rechercheBloc}">

                     }

        // Compte le nombre de colis appartenant à chaque onglet.

        const compteursOnglets = {
            'en-attente': 0,
            'traitement': 0,
            'chez-livreur': 0
        };

        commandes.forEach(colis => {
            const statutGlobal = colis.statutGlobal || colis.statut || 'N/A';
            const ongletAssocie = determinerOngletStatut(statutGlobal);

            // L'historique n'a pas de badge : seuls les onglets opérationnels
            // affichent un volume de colis à suivre.
            if (Object.prototype.hasOwnProperty.call(compteursOnglets, ongletAssocie)) {
                compteursOnglets[ongletAssocie]++;
            }
        });

        // Met à jour un badge et le masque lorsqu'il n'y a aucun colis.
        function mettreAJourBadgeCompteur(identifiant, total) {
            const badge = document.getElementById(identifiant);
            if (!badge) return;

            badge.textContent = total;
            badge.style.display = total > 0 ? 'inline-block' : 'none';
        }

        mettreAJourBadgeCompteur('compteur-en-attente', compteursOnglets['en-attente']);
        mettreAJourBadgeCompteur('compteur-traitement', compteursOnglets.traitement);
        mettreAJourBadgeCompteur('compteur-chez-livreur', compteursOnglets['chez-livreur']);
        mettreAJourBadgeHistorique();

        appliquerFiltrage();
    } catch (err) {
        console.error(err);
        alert('Erreur lors du chargement des ventes.');
    } finally {
        document.getElementById('overlay').classList.remove('active');
        document.getElementById('loader').classList.remove('active');
    }
}

// Normalise un statut pour le rendre comparable, même si la base contient
// des accents, des majuscules, des tirets ou des underscores.
function normaliserStatut(statut) {
    return (statut || '')
        .toString()
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[-_]/g, ' ')
        .replace(/\s+/g, ' ');
}

// Classe un statut dans une famille métier simple pour l'interface.
// Cette version est plus robuste que les tests simples sur des mots-clés,
// car elle gère les statuts réels présents en base et laisse une marge
// pour des nouveaux statuts ajoutés plus tard.
// Classe les statuts reçus en familles métier simples pour l’interface.
// Cela permet de reconnaître correctement les valeurs issues de la base, y compris "attribuéeAlivreur".
function classerStatut(statut) {
    const statutNorm = normaliserStatut(statut);

    if (!statutNorm) return 'inconnu';

    // Mapping explicite des statuts connus de la base.
    const mappingStatuts = {
        'en attente': 'en attente',
        'en cours': 'en cours',
        'encours': 'en cours',
        'expediee': 'expediee',
        'expedie': 'expediee',
        'attribuee a livreur': 'attribueealivreur',
        'attribueealivreur': 'attribueealivreur',
        'attribuee au livreur': 'attribueealivreur',
        'attribuee alivreur': 'attribueealivreur',
        'prise en charge': 'prise en charge',
        'livree': 'livree',
        'livreee': 'livree',
        'echec de livraison': 'echec de livraison',
        'echec livraison': 'echec de livraison',
        'annulee': 'annulee',
        'annuler': 'annulee',
        'annulee par acheteur': 'annulee par acheteur',
        'annulee par l acheteur': 'annulee par acheteur',
        'annulee par vendeur': 'annulee par vendeur',
        'annulee par le vendeur': 'annulee par vendeur'
    };

    if (mappingStatuts[statutNorm]) {
        return mappingStatuts[statutNorm];
    }

    // Fallback souple pour les nouveaux statuts :
    // on regarde les mots-clés uniquement s'ils correspondent à des familles métier.
    if (statutNorm.includes('annule')) return 'annulee';
    if (statutNorm.includes('livre')) return 'livree';
    if (statutNorm.includes('echec') && statutNorm.includes('livraison')) return 'echec de livraison';
    if (statutNorm.includes('attente')) return 'en attente';
    if (statutNorm.includes('cours') || statutNorm.includes('prepar') || statutNorm.includes('trait') || statutNorm.includes('charge')) return 'en cours';
    if (statutNorm.includes('exped')) return 'expediee';
    if (statutNorm.includes('attribue') && statutNorm.includes('livreur')) return 'attribuee a livreur';

    return statutNorm;
}

// Détermine si un colis appartient réellement à l'onglet Historique.
// Cette fonction reprend le classement principal des onglets afin d'éviter
// qu'un colis « livré » soit compté dans Historique alors qu'il reste affiché
// dans « Chez livreur ».
function estStatutHistorique(statut) {
    return determinerOngletStatut(statut) === 'historique';
}

// Récupère la liste des identifiants historiques déjà lus par le vendeur.
// Une protection est prévue au cas où le stockage du navigateur serait indisponible.
function obtenirHistoriqueLu() {
    try {
        const historiqueLu = JSON.parse(localStorage.getItem(CLE_HISTORIQUE_LU) || '[]');
        return Array.isArray(historiqueLu) ? historiqueLu : [];
    } catch (erreur) {
        console.warn('Impossible de lire les historiques consultés.', erreur);
        return [];
    }
}

// Enregistre les identifiants historiques que le vendeur vient de consulter.
function enregistrerHistoriqueLu(identifiants) {
    try {
        localStorage.setItem(CLE_HISTORIQUE_LU, JSON.stringify(identifiants));
    } catch (erreur) {
        console.warn('Impossible d’enregistrer les historiques consultés.', erreur);
    }
}

// Met à jour le badge comme une notification de messagerie :
// seuls les colis historiques qui n'ont jamais été ouverts sont comptés.
function mettreAJourBadgeHistorique() {
    const badge = document.getElementById('compteur-historique');
    if (!badge) return;

    const colisHistoriques = commandesChargees
        // Le badge suit exactement le même classement que l'onglet Historique.
        .filter(colis => determinerOngletStatut(colis.statutGlobal || colis.statut || '') === 'historique')
        .map(colis => String(colis.colisGroupId || colis._id || ''))
        .filter(Boolean);
    const historiqueLu = obtenirHistoriqueLu();
    const nombreNonLus = colisHistoriques.filter(id => !historiqueLu.includes(id)).length;//compte le nombre de colis historiques non lus

    badge.textContent = nombreNonLus;
    badge.style.display = nombreNonLus > 0 ? 'inline-block' : 'none';
}

// Considère tous les colis historiques actuellement chargés comme lus
// dès que l'utilisateur ouvre l'onglet Historique.
function marquerHistoriqueCommeLu() {
    const identifiantsHistoriques = commandesChargees
        // Seuls les colis réellement visibles dans Historique sont marqués lus.
        .filter(colis => determinerOngletStatut(colis.statutGlobal || colis.statut || '') === 'historique')
        .map(colis => String(colis.colisGroupId || colis._id || ''))
        .filter(Boolean);

    if (identifiantsHistoriques.length === 0) return;

    const historiqueLu = new Set(obtenirHistoriqueLu());
    identifiantsHistoriques.forEach(id => historiqueLu.add(id));
    enregistrerHistoriqueLu([...historiqueLu]);
    mettreAJourBadgeHistorique();
}

// Associe chaque statut à l'un des quatre onglets de la page vendeur.
// Les statuts inconnus restent dans « En traitement » afin de rester visibles.
function determinerOngletStatut(statut) {
    const statutClasse = classerStatut(statut);

    if (statutClasse === 'en attente') return 'en-attente';
    if (['en cours', 'expediee'].includes(statutClasse)) return 'traitement';
    if (['attribueealivreur', 'prise en charge', 'echec de livraison'].includes(statutClasse)) return 'chez-livreur';
    if (['livree', 'annulee', 'annulee par acheteur', 'annulee par vendeur'].includes(statutClasse)) return 'historique';

    return 'traitement';
}

// Met à jour le statut global d'un colis complet via l'API.
// Cette fonction sert à faire avancer le colis dans son parcours de livraison.
async function changerStatutColis(colisGroupId, nouveauStatut) {
    if (!confirm(`Confirmer passage du colis ${colisGroupId} au statut "${nouveauStatut}" ?`)) return;
    document.getElementById('overlay').classList.add('active');
    document.getElementById('loader').classList.add('active');
    try {
        const response = await fetch(`${CONFIG.API_BASE_URL}/api/orders/colis/${colisGroupId}/statut`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            },
            body: JSON.stringify({ statut: nouveauStatut })
        });
        if (response.ok) {
            alert('Statut du colis mis à jour.');
            chargerMesVentes();
        } else {
            const data = await response.json().catch(()=>({}));
            alert('Erreur serveur : ' + (data.error || response.status));
        }
    } catch (err) {
        console.error(err);
        alert('Erreur réseau lors du changement de statut du colis.');
    } finally {
        document.getElementById('overlay').classList.remove('active');
        document.getElementById('loader').classList.remove('active');
    }
}

// Applique les filtres visibles sur la page :
// - le statut actif (l'un des quatre onglets ou un filtre secondaire)
// - la recherche saisie par l'utilisateur dans la barre de recherche
// Cette fonction masque ou affiche les cartes et les blocs selon les critères.
function appliquerFiltrage() {
    const termeRechercheNorm = normaliserTexteRecherche(termeRecherche);

    // Vérifie si le statut d'un élément correspond à l'onglet sélectionné.
    const filtreAffiche = statutRaw => {
        // Chaque onglet correspond à une famille métier complète de statuts.
        return determinerOngletStatut(statutRaw) === filtreActuel;
    };

    // Vérifie si le texte d'un élément contient la requête de recherche.
    const rechercheAffiche = bloc => {
        if (!termeRechercheNorm) return true;
        const contenuRecherche = (bloc.getAttribute('data-recherche') || '').trim();
        return contenuRecherche.includes(termeRechercheNorm);
    };

    // Sécurité supplémentaire : si un bloc n'a pas encore de donnée de recherche,
    // on la calcule à partir du contenu visible du bloc.
    document.querySelectorAll('.colis-block').forEach(bloc => {
        const contenu = (bloc.getAttribute('data-recherche') || '').trim();
        if (!contenu) {
            bloc.setAttribute('data-recherche', normaliserTexteRecherche(bloc.textContent || ''));
        }
    });

    // Applique la combinaison des deux filtres aux lignes internes (articles).
    document.querySelectorAll('.commande-card').forEach(carte => {
        const statutRaw = carte.getAttribute('data-statut') || '';
        const visibleParStatut = filtreAffiche(statutRaw);
        const visibleParRecherche = rechercheAffiche(carte);
        carte.style.display = visibleParStatut && visibleParRecherche ? 'block' : 'none';
    });

    // Applique aussi le même filtrage au bloc principal du colis.
    document.querySelectorAll('.colis-block').forEach(bloc => {
        const statutRaw = bloc.getAttribute('data-statut') || '';
        const visibleParStatut = filtreAffiche(statutRaw);
        const visibleParRecherche = rechercheAffiche(bloc);
        bloc.style.display = visibleParStatut && visibleParRecherche ? 'block' : 'none';
    });
}

// Bascule entre les quatre onglets et relance le filtrage de la page.
function basculerOnglet(mode) {
    const ongletsAutorises = ['en-attente', 'traitement', 'chez-livreur', 'historique'];
    filtreActuel = ongletsAutorises.includes(mode) ? mode : 'en-attente';

    // L'ouverture de l'onglet confirme la lecture de tous ses colis historiques.
    if (filtreActuel === 'historique') {
        marquerHistoriqueCommeLu();
    }

    document.querySelectorAll('.onglet').forEach(btn => {
        btn.classList.toggle('active', btn.id === `onglet-${filtreActuel}`);
    });

    appliquerFiltrage();
}

// Annule une commande côté vendeur via l'API.
// Cette action est réservée aux commandes qui ne sont pas déjà livrées
// ou déjà annulées.
async function annulerCommande(commandeId) {
    if (!confirm('Êtes-vous sûr de vouloir annuler cette commande ? Cette action est irréversible.')) return;

    document.getElementById('overlay').classList.add('active');
    document.getElementById('loader').classList.add('active');
    try {
        const response = await fetch(`${CONFIG.API_BASE_URL}/api/orders/${commandeId}/annuler`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            }
        });

        if (response.ok) {
            alert("Commande annulée avec succès !");
            chargerMesVentes();
        } else {
            const errorData = await response.json().catch(() => ({}));
            alert("Erreur du serveur : " + (errorData.error || "Impossible d'annuler la commande, veuillez vérifier son statut."));
        }
    } catch (err) {
        console.error(err);
        alert("Erreur lors de l'annulation de la commande.");
    } finally {
        document.getElementById('overlay').classList.remove('active');
        document.getElementById('loader').classList.remove('active');
    }
}

// Met à jour le statut d'une seule commande individuelle.
// Cette fonction est utilisée pour faire évoluer une commande dans l'interface.
async function changerStatut(commandeId, nouveauStatut) {
    if (!confirm(`Confirmer passage de la commande ${commandeId} au statut "${nouveauStatut}" ?`)) return;

    document.getElementById('overlay').classList.add('active');
    document.getElementById('loader').classList.add('active');
    try {
        const response = await fetch(`${CONFIG.API_BASE_URL}/api/orders/${commandeId}/statut`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('token')}`
            },
            body: JSON.stringify({ statut: nouveauStatut })
        });

        if (response.ok) {
            chargerMesVentes();
        } else {
            const errorData = await response.json().catch(() => ({}));
            alert("Erreur du serveur : " + (errorData.error || "Impossible de modifier le statut."));
        }
    } catch (err) {
        console.error(err);
        alert("Erreur lors du changement de statut.");
    } finally {
        document.getElementById('overlay').classList.remove('active');
        document.getElementById('loader').classList.remove('active');
    }
}


// Télécharge la facture PDF d'un colis via l'API backend.
// Le fichier est récupéré en tant que blob puis proposé en téléchargement.
async function telechargerFacturePDF(colisGroupId) {
    const token = localStorage.getItem('token');
    if (!token) {
        alert("Session expirée. Veuillez vous reconnecter.");
        return;
    }

    try {
        // Appeler la route API du backend
        const response = await fetch(`${CONFIG.API_BASE_URL}/api/orders/${colisGroupId}/invoice?role=vendeur`, {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        if (!response.ok) {
            throw new Error("Impossible de récupérer le fichier PDF.");
        }

        // Convertir la réponse HTTP brute en fichier Blob (Binary Large Object)
        const blob = await response.blob();
        
        // Créer un lien caché dans le navigateur pour lancer le téléchargement
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Facture-${colisGroupId}.pdf`; // Nom du fichier sur la machine du client
        document.body.appendChild(a);
        a.click(); // Clique automatiquement sur le lien
        
        // Nettoyage de la mémoire du navigateur
        a.remove();
        window.URL.revokeObjectURL(url);

    } catch (error) {
        console.error("Erreur de téléchargement :", error);
        alert("Erreur lors du téléchargement de la facture PDF.");
    }
}
