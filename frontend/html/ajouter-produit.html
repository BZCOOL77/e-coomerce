<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="../../client/js/url.js"></script>
    <link rel="stylesheet" href="../css/syleform.css">
    <script src="../js/header-auth.js" defer></script>
</head>
<body>
    <!--pour le loader-->
    <div id="overlay"></div>
    <div id="loader"><div class="spinner"></div></div>
    <h1>Renseignez les informations de votre produit</h1>
    
    <form id="productForm">
        <p class="p1">Remplissez le formulaire de vente</p>
        <input type="text" id="nom" placeholder="Nom du produit" required><br>
        <input type="number" id="prix" placeholder="Prix" required><br>
        <input type="textarea" id="description" placeholder="Description" required></input><br>
        <input type="text" id="image" placeholder="Lien de l'image" required><br>
        <input type="number" id="stock" name="stock" min="1" value="10" placeholder="quantité en stock" required class="form-input"><br>
        <div class="categorie">
            <input type="radio" id="categorie1" name="categorie" value="Électronique" required>
            <label for="categorie1">Électronique</label>
            <input type="radio" id="categorie2" name="categorie" value="Vêtements">
            <label for="categorie2">Vêtements</label>
            <input type="radio" id="categorie3" name="categorie" value="Maison">
            <label for="categorie3">Maison</label>
            <input type="radio" id="categorie4" name="categorie" value="Autres">
            <label for="categorie4">Autres</label>
        </div>
        
        
        <button type="submit" id="envoyer">Terminer</button>
    </form>

    <script>

        //pour le loader
    const loader = document.getElementById('loader');
    const overlay = document.getElementById('overlay');

    function showLoading() {
    loader.style.display = 'block';
    overlay.style.display = 'block';
    }

    function hideLoading() {
    loader.style.display = 'none';
    overlay.style.display = 'none';
    }

        const form = document.getElementById('productForm');

        const envoyerproduit = async (event) => {
            event.preventDefault(); // On stop le rechargement de la page

            showLoading(); // On affiche le loader

            // 1. On récupère les valeurs AU MOMENT du clic
            const nouveauProduit = {
                nom: document.getElementById('nom').value,
                prix: Number(document.getElementById('prix').value),
                description: document.getElementById('description').value,
                image: document.getElementById('image').value,
                stock: Number(document.getElementById('stock').value),
                categorie: document.querySelector('input[name="categorie"]:checked').value
            };

            try {
                // 2. On utilise POST pour envoyer des données
                const reponse = await fetch(`${CONFIG.API_BASE_URL}/api/products`, {
                    method: 'POST',
                    headers: getHeaders(), //   le token est ajouté automatiquement !
                    body: JSON.stringify(nouveauProduit)
                });

                if (reponse.ok) {
                    alert('Produit ajouté avec succès ! 🔥');
                    window.location.href = 'nav.html';
                } else {
                    const errorData = await reponse.json();
                    // 2. On affiche TOUT ce que le serveur a envoyé sous forme de texte
                    // JSON.stringify transforme l'objet en chaine de caractères
                     alert("Détails de l'erreur serveur : " + JSON.stringify(errorData)); 
    
                     // 3. On garde aussi le log pour inspecter avec F12 (plus confortable)
                     console.log("Objet d'erreur complet :", errorData);
                }
            } catch (error) {
                console.error('Erreur Fetch :', error);
                alert('Impossible de contacter le serveur. Vérifie si le backend tourne !');
            }finally {
                hideLoading(); // On cache le loader, même s'il y a eu une erreur
            }
        };

        // On écoute le "submit" du formulaire, c'est plus propre que le "click"
        form.addEventListener('submit', envoyerproduit);


 




</script>
</body>
</html>
